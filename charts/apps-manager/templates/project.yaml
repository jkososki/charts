{{- range $proj := $.Values.projects }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  labels:
    {{- include "apps-manager.labels" $ | nindent 4 }}
  name: {{ required "Project name is required." (include "apps-manager.prefixed" (list $proj.prefix $proj.name)) }}
spec:
  {{- if $proj.spec }}
  {{- toYaml $proj.spec | nindent 2 }}
  {{- else }}
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    server: '*'
  roles: []
  sourceRepos:
  - '*'
  {{- end }}
---
{{- end }}
