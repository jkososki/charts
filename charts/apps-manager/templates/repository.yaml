{{- range $repo := $.Values.repositories }}
{{- if $repo.create }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    argocd.argoproj.io/secret-type: repository
    {{- include "apps-manager.labels" $ | nindent 4 }}
  name: repo-{{ $repo.name }}
stringData:
  {{- (tpl (toYaml $repo.stringData) .) | nindent 2}}
{{- end }}
---
{{- end }}
