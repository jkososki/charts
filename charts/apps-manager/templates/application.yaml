{{- $projects := .Values.projects -}}
{{- $repos := .Values.repositories -}}
{{- $valuesRepo := (get $repos .Values.valuesRepo) -}}
{{- $applications := .Values.applications }}
{{- range $appKey := .Values.enabledApplications }}
{{- $appVal := get $applications $appKey }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "apps-manager.prefixed" (list $appVal.prefix $appVal.name) }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    {{- include "apps-manager.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  {{- $project := get $projects $appVal.project }}
  {{- if not $project }}
  {{- fail (printf "Valid project required for application: %s" $appKey) }}
  {{- end }}
  {{- $projectName := include "apps-manager.prefixed" (list $project.prefix $project.name) }}
  project: {{ required (printf "Valid project required for %s" $appKey) $projectName }}
  sources:
    {{- $helmRepo := (get $repos $appVal.chart.registry).stringData.url }}
    {{- if not $helmRepo }}
    {{- fail (printf "Valid chart.registry required for application: %s" $appKey) }}
    {{- end }}
    - repoURL: {{ $helmRepo }}
      targetRevision: {{ required (printf "Missing chart.targetRevision for %s" $appKey) $appVal.chart.targetRevision }}
      {{- if $appVal.chart.name }}
      chart: {{ $appVal.chart.name }}
      {{- end }}
      helm:
        {{- if $appVal.skipCrds }}
        skipCrds: true
        {{- end }}
        {{- if $appVal.parameters }}
        parameters:
          {{- toYaml $appVal.parameters | nindent 10}}
        {{- end  }}
        valueFiles:
          - $values/{{ $appVal.valuesPath }}/base.values.yaml
          - $values/{{ $appVal.valuesPath }}/env/{{ $.Values.valuesEnv }}.values.yaml
    - repoURL: {{ $valuesRepo.stringData.url }}
      targetRevision: {{ required "Missing valuesBranch." $.Values.valuesBranch }}
      ref: values
  destination:
    name: in-cluster
    namespace: {{ required (printf "Missing namespace for %s" $appKey) $appVal.destination.namespace }}
  syncPolicy:
    {{- $automated := dict "prune" true }}
    {{- $automated := merge (default ($appVal.syncPolicy).automated dict) $automated }}
    automated:
      {{- toYaml $automated | nindent 6 }}
    {{- $syncOptions := dict "CreateNamespace" true "ServerSideApply" true }}
    {{- $syncOptions := merge (default ($appVal.syncPolicy).syncOptions dict) $syncOptions }}
    syncOptions:
    {{- range $k, $v := $syncOptions }}
      - {{ printf "%s=%v" $k $v }}
    {{- end }}
  revisionHistoryLimit: {{ $appVal.revisionHistoryLimit | default 0  }}
  {{ if $appVal.ignoreDifferences }}
  ignoreDifferences: {{ $appVal.ignoreDifferences | toYaml | nindent 4 }}
  {{ end }}
---
{{- end }}
