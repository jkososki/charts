# This is to override the chart name.
fullnameOverride: ""
nameOverride: ""

# Argo CD Repositories
# This section defines the repositories to which Argo CD will connect.
# A map of strindata objects. The key is used as reference.
# See https://argo-cd.readthedocs.io/en/stable/operator-manual/argocd-repositories-yaml/
repositories: {}

# Repository for values files
valuesRepo: ""

# Branch to use for values
valuesBranch: main

# Argo CD Projects
# A map of projects. The key will be used for reference.
# The spec is optional. If provided, must follow https://argo-cd.readthedocs.io/en/stable/operator-manual/project-specification/.
# projects:
#   <proj-key>:
#     name: string
#     prefix: optional(string)
#     spec: {}
projects: {}

# Argo CD Application
# A map of applications managed by the app-of-apps
# ------------
# argocd:
#   enabled: true
#   name: argocd
#   prefix: ""
#   project: infrastructure
#   valuesRepo: homelabApps
#   valuesPath: catalog/argocd
#   valuesEnv: dev
#   chart:
#     name: argo-cd
#     targetRevision: 10.11.6
#     registry: https://argoproj.github.io/argo-helm
#   destination:
#     namespace: argocd
#   ignoreDifferences: []
#   skipCrds: false
#   parameters: []
#   revisionHistoryLimit: 0
#   syncPolicy:
#     automated: {}
applications: {}
