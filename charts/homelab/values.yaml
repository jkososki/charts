environment: ""

clusters:
  local: in-cluster

gitRepositories:
  forgeCoreweave: https://github.com/Sindri-Labs/forge-coreweave
  forgeDeployment: https://github.com/Sindri-Labs/forge-deployment

helmRegistries:
  sindriHarbor: registry.sindri.app/charts

applications: {}

  # Example:
  # ------------
  # argocd:
  #   name: argocd
  #   project: infrastructure
  #   valuesRepo: forgeDeployment
  #   valuesPath: projects/infrastructure/gke/argo-cd
  #   chart:
  #     name: argo-cd
  #     targetRevision: 5.51.0
  #     registry: sindriHarbor
  #   destination:
  #     namespace: argocd
  #     cluster: local


installers:
  forgeApplications:
    disableAutoSync: true
    valuesBranch: main
    name: forge-applications
    createProject: true
    project: "{{ $.Values.environment }}-forge"
    valuesRepo: https://github.com/Sindri-Labs/forge-deployment
    valuesPath: projects/management/forge-applications
    appPrefix: "{{ $.Values.environment }}"
    chart:
      name: sindrilabs/app-of-apps
      targetRevision: 0.1.27
      registry: registry-1.docker.io
    destination:
      namespace: argocd
      cluster: local
