# .pre-commit-config.yaml (prek reads this too)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^charts/.*/templates/

  # helm lint on each chart
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Render each chart and validate against K8s schemas
      - id: kubeconform
        name: helm template | kubeconform
        language: system
        pass_filenames: false
        files: ^charts/
        entry: bash -c 'for c in charts/*/; do helm template "$c" | kubeconform -strict -summary -ignore-missing-schemas || exit 1; done'
